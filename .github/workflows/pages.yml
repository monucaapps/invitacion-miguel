name: Publicar invitación demo (GitHub Pages)

on:
  push:
    branches: ["claude/wedding-qr-invitation-quote-4o6q82"]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages (y activarlo si hace falta)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir el sitio (solo la carpeta demo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo

      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
